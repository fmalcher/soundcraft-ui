version: 2

# npm: version updates are disabled (open-pull-requests-limit: 0), so Dependabot
# only opens PRs for security updates. Groups apply to security updates only.
updates:
  # Root dependencies (Nx Workspace)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'deps'
    # These dependencies are handled by 'nx migrate' and should be ignored by Dependabot
    ignore:
      - dependency-name: '@angular/*'
      - dependency-name: '@angular-devkit/*'
      - dependency-name: '@schematics/angular'
      - dependency-name: 'nx'
      - dependency-name: 'eslint'
      - dependency-name: '@nx/*'
      - dependency-name: '@angular-eslint/*'
      - dependency-name: 'typescript'
    groups:
      # Build & Development Tools
      build-tools:
        applies-to: security-updates
        patterns:
          - 'vite*'
          - 'vitest*'
          - '@vitest/*'
          - '@swc/*'
          - '@swc-node/*'
          - 'rollup-plugin-*'
          - 'jiti'
          - 'jsdom'
          - 'dotenv'
          - '@rollup/rollup-linux-x64-gnu'
          - '@typescript-eslint/*'

  # Docs dependencies (Docusaurus site)
  - package-ecosystem: 'npm'
    directory: '/docs'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'deps'
    groups:
      # Docusaurus core & plugins
      docusaurus:
        applies-to: security-updates
        patterns:
          - '@docusaurus/*'
      # React ecosystem
      react:
        applies-to: security-updates
        patterns:
          - 'react'
          - 'react-dom'
          - '@mdx-js/*'
          - 'prism-react-renderer'
          - 'clsx'

  # GitHub Actions used in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns:
          - '*'
